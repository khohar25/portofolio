<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Halaman Tidak Ditemukan | Khohar Muhamad Fatahurrohman</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=34">
    <style>
        .error-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }
        .error-card {
            max-width: 580px;
            padding: 48px 36px;
            background: rgba(13, 17, 28, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 200, 255, 0.1);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #38bdf8 0%, #a855f7 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary, #f1f5f9);
            margin-bottom: 14px;
        }
        .error-desc {
            font-size: 0.95rem;
            color: var(--text-secondary, #94a3b8);
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.35);
            transition: all 0.3s ease;
        }
        .error-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(2, 132, 199, 0.5);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <main class="error-hero">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 class="error-title">Koordinat Tidak Ditemukan</h1>
            <p class="error-desc">
                Halaman atau arsip yang Anda tuju telah dipindahkan, direlokasi, atau tidak tersedia di dalam repositori sistem. Silakan kembali ke pusat kendali utama.
            </p>
            <a href="https://khoharrohman.my.id/" class="error-btn">
                <i class="fas fa-home"></i> Kembali ke Beranda
            </a>
        </div>
    </main>
</body>
</html>
