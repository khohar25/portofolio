<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajeng Nopo Bolo?</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <style>
        :root {
            --bg: #f0f2f5; 
            --card: #ffffff; 
            --primary: #149ddd; 
            --primary-hover: #117baf; 
            --text: #333; 
            --border: #ddd;
            --dark-terminal: #1e293b;
            --blue-terminal: #38bdf8;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }
        
        .dashboard { 
            background: var(--card); 
            max-width: 650px; 
            width: 100%; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            padding: 35px; 
            margin-bottom: 50px;
        }
        
        /* HEADER AREA */
        .header-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px dashed var(--border); 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
        }
        .header-container h2 { 
            color: var(--primary); 
            font-weight: 800; 
            margin: 0; 
            font-size: 1.5rem;
        }
        .btn-logout { 
            background: transparent; 
            color: #dc2626; 
            border: 2px solid #dc2626; 
            padding: 8px 15px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .btn-logout:hover { background: #fee2e2; }

        /* AUTH SCREEN */
        .auth-screen { max-width: 450px; text-align: center; margin-top: 10vh; }
        .auth-screen i.fa-lock { font-size: 4rem; color: var(--primary); margin-bottom: 20px; opacity: 0.8; }
        .auth-screen h2 { font-size: 1.8rem; color: var(--primary); margin-bottom: 15px; }

        /* TABS SYSTEM */
        .tabs { display: flex; gap: 12px; margin-bottom: 25px; background: #f1f5f9; padding: 5px; border-radius: 12px; }
        .tab-btn { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            background: transparent; 
            color: #64748b; 
            font-weight: 700; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.3s; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(20, 157, 221, 0.3); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from {opacity: 0; transform: translateY(15px);} to {opacity: 1; transform: translateY(0);} }

        /* FORM ELEMENTS */
        label { font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; display: block; color: #475569;}
        input, select, textarea { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 18px; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            font-family: 'Inter', sans-serif; 
            box-sizing: border-box; 
            font-size: 0.95rem;
            transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; background: #f8fafc; }
        
        .btn-submit { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.1rem; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.3s; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 12px;
            margin-top: 15px;
        }
        .btn-submit:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; }

        .spinner { display: none; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #statusMessage, #login-msg { margin-top: 25px; padding: 18px; border-radius: 10px; display: none; font-weight: 700; text-align: center; }
        .success { background: #dcfce7; color: #166534; border: 2px solid #bbf7d0; }
        .error { background: #fee2e2; color: #991b1b; border: 2px solid #fecaca; }

        /* PREVIEW & TERMINAL */
        #imgPreview { max-width: 100%; border-radius: 12px; margin-bottom: 20px; display: none; border: 3px dashed #e2e8f0; padding: 8px; background: #f8fafc; }
        #kompresiInfo { font-size: 0.9rem; color: #059669; text-align: center; margin-bottom: 20px; font-weight: 700; }
        
        .progress-box { 
            background: var(--dark-terminal); 
            color: var(--blue-terminal); 
            padding: 15px; 
            border-radius: 12px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 0.85rem; 
            margin-top: 20px; 
            display: none; 
            text-align: left; 
            max-height: 250px; 
            overflow-y: auto; 
            border-left: 5px solid var(--primary);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="login-screen" class="dashboard auth-screen">
        <i class="fas fa-lock"></i>
        <h2>Niki Kulo Kunci Bolo</h2>
        <p style="font-size: 1rem; color: #64748b; margin-bottom: 30px;">Ajeng Nopo Bolo? Kok Pean Dugi Mriki</p>
        
        <form id="login-form">
            <label>Email Admin</label>
            <input type="email" id="login-email" placeholder="contoh@admin.com" required>
            <label>Password Rahasia</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
            <button type="submit" class="btn-submit" id="btn-login-auth">
                BUKA AKSES <i class="fas fa-unlock"></i>
            </button>
        </form>
        <div id="login-msg" class="error"></div>
    </div>


    <div id="admin-panel" class="dashboard" style="display: none;">
        
        <div class="header-container">
            <h2><i class="fas fa-robot"></i> Dekengane Tiang Alit</h2>
            <button onclick="handleLogout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Keluar</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('auto')"><i class="fas fa-layer-group"></i> AI Batch Scan</button>
            <button class="tab-btn" onclick="switchTab('manual')"><i class="fas fa-keyboard"></i> Ketik Manual</button>
        </div>

        <div id="tab-auto" class="tab-content active">
            <div style="background: #f0f9ff; padding: 20px; border-radius: 12px; margin-bottom: 25px; font-size: 0.9rem; color: #0369a1; border-left: 5px solid var(--primary); line-height: 1.5;">
                <i class="fas fa-info-circle"></i> <b>Fitur Batch Processing Aktif!</b><br>
                Unggah PDF berisi banyak sertifikat, sistem akan memecah halaman dan memproses satu per satu secara otomatis.
            </div>
            
            <label>Pilih File (JPG / PNG / PDF Multi-Page):</label>
            <input type="file" id="imageInput" accept="image/*, application/pdf" onchange="previewAndCompressImage(event)">
            
            <img id="imgPreview" alt="Preview Dokumen">
            <div id="kompresiInfo"></div>

            <button class="btn-submit" id="btnUpload" onclick="kirimKeAI('gambar')">
                <span class="btn-text"><i class="fas fa-rocket"></i> Proses & Simpan Semua</span>
                <div class="spinner"></div>
            </button>
            
            <div id="progressTerminal" class="progress-box"></div>
        </div>

        <div id="tab-manual" class="tab-content">
            <label for="pilihKategori">Pilih Kategori Tabel Database:</label>
            <select id="pilihKategori" onchange="renderDynamicForm()">
                <option value="">-- Pilih Laci Tujuan --</option>
                <option value="sertifikat">Sertifikat Lomba / Juara</option>
                <option value="sertifikasi">Sertifikasi Profesional (Lisensi)</option>
                <option value="webinar">Seminar / Webinar / Kursus</option>
                <option value="organisasi">Pengalaman Organisasi</option>
                <option value="portofolio">Proyek IT / Coding</option>
                <option value="network">Event / Networking / Jaringan</option>
                <option value="lab">Riset / Inovasi (Lab)</option>
                <option value="library">Pustaka / Buku / Karya Tulis</option>
                <option value="tabel_artikel">Artikel / Blog Post</option>
                <option value="pendidikan">Riwayat Pendidikan</option>
            </select>

            <div id="dynamicFieldsContainer" style="margin-top: 15px;"></div>

            <button class="btn-submit" id="btnManual" style="display: none;" onclick="kirimKeAI('manual')">
                <span class="btn-text"><i class="fas fa-database"></i> Simpan Manual</span>
                <div class="spinner"></div>
            </button>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        // ==========================================================
        // 1. KONFIGURASI SUPABASE & AUTH
        // ==========================================================
        const SUPABASE_URL = 'https://xwwlegzacxevmlmtceqh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3d2xlZ3phY3hldm1sbXRjZXFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MDA2NzEsImV4cCI6MjA5Mzk3NjY3MX0.C9qCfFVN9j8gtvsLVBFGh4I28gIRvJkYlp546-ssEgw';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginScreen = document.getElementById('login-screen');
        const adminPanel = document.getElementById('admin-panel');

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                loginScreen.style.display = 'none';
                adminPanel.style.display = 'block';
            }
        }
        checkSession();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login-auth');
            const msg = document.getElementById('login-msg');

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi...';
            const { error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                msg.style.display = 'block';
                msg.innerHTML = "❌ Akses Ditolak: " + error.message;
                btn.innerHTML = 'BUKA AKSES <i class="fas fa-unlock"></i>';
            } else {
                window.location.reload();
            }
        });

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        // ==========================================================
        // 2. LOGIKA BATCH SCANNING & PDF LOOPING
        // ==========================================================
        const VERCEL_API_URL = "https://portofolio-xi-self.vercel.app/api/ekstrak"; 
        let imageQueue = []; // Antrean gambar untuk diproses

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            event.currentTarget.classList.add('active');
            tampilkanStatus("", "");
            document.getElementById("progressTerminal").style.display = "none";
        }

        const schemaDatabase = {
            'sertifikat': [{id: 'nama_penghargaan', label: 'Nama Penghargaan', type: 'text'}, {id: 'pemberi_penghargaan', label: 'Penyelenggara', type: 'text'}, {id: 'tahun', label: 'Tahun', type: 'text'}, {id: 'deskripsi', label: 'Deskripsi Singkat', type: 'textarea'}],
            'sertifikasi': [{id: 'nama_sertifikasi', label: 'Nama Sertifikasi', type: 'text'}, {id: 'penerbit', label: 'Penerbit', type: 'text'}, {id: 'tanggal_terbit', label: 'Tanggal Terbit', type: 'text'}, {id: 'link_kredensial', label: 'Link Verifikasi', type: 'text'}],
            'webinar': [{id: 'judul_acara', label: 'Judul Webinar', type: 'text'}, {id: 'penyelenggara', label: 'Penyelenggara', type: 'text'}, {id: 'tahun', label: 'Tahun', type: 'text'}, {id: 'keterangan', label: 'Keterangan', type: 'textarea'}],
            'organisasi': [{id: 'nama_organisasi', label: 'Nama Organisasi', type: 'text'}, {id: 'peran', label: 'Jabatan / Peran', type: 'text'}, {id: 'tahun', label: 'Masa Jabatan', type: 'text'}, {id: 'deskripsi', label: 'Tugas Utama', type: 'textarea'}],
            'portofolio': [{id: 'judul', label: 'Judul Proyek', type: 'text'}, {id: 'kategori', label: 'Kategori (Web/IoT/App)', type: 'text'}, {id: 'konteks_masalah', label: 'Masalah', type: 'textarea'}, {id: 'solusi_teknis', label: 'Solusi & Tech Stack', type: 'textarea'}, {id: 'link', label: 'Link GitHub/Live', type: 'text'}],
            'network': [{id: 'tipe', label: 'Tipe Event', type: 'text'}, {id: 'nama_kegiatan', label: 'Nama Kegiatan', type: 'text'}, {id: 'platform_atau_tempat', label: 'Tempat/Platform', type: 'text'}, {id: 'tahun', label: 'Tahun', type: 'text'}, {id: 'deskripsi', label: 'Ringkasan', type: 'textarea'}],
            'lab': [{id: 'judul_riset', label: 'Judul Riset', type: 'text'}, {id: 'status', label: 'Status (Selesai/Progres)', type: 'text'}, {id: 'deskripsi', label: 'Deskripsi Riset', type: 'textarea'}],
            'library': [{id: 'judul', label: 'Judul Buku / Tulisan', type: 'text'}, {id: 'kategori', label: 'Kategori', type: 'text'}, {id: 'deskripsi', label: 'Sinopsis', type: 'textarea'}, {id: 'link', label: 'Link Baca', type: 'text'}],
            'tabel_artikel': [{id: 'judul', label: 'Judul Artikel', type: 'text'}, {id: 'kategori', label: 'Topik', type: 'text'}, {id: 'deskripsi', label: 'Isi Ringkas', type: 'textarea'}, {id: 'link', label: 'URL Artikel', type: 'text'}],
            'pendidikan': [{id: 'instansi', label: 'Nama Instansi', type: 'text'}, {id: 'lokasi', label: 'Lokasi', type: 'text'}, {id: 'jenjang_prodi', label: 'Prodi / Jurusan', type: 'text'}, {id: 'tahun', label: 'Tahun Lulus/Aktif', type: 'text'}]
        };

        function renderDynamicForm() {
            const kat = document.getElementById('pilihKategori').value;
            const container = document.getElementById('dynamicFieldsContainer');
            const btn = document.getElementById('btnManual');
            container.innerHTML = ''; 
            if (!kat) { btn.style.display = 'none'; return; }

            schemaDatabase[kat].forEach(field => {
                const wrap = document.createElement('div');
                const lbl = document.createElement('label'); lbl.innerText = field.label;
                let inp = field.type === 'textarea' ? document.createElement('textarea') : document.createElement('input');
                inp.id = field.id; inp.className = 'dynamic-input';
                if (field.type !== 'textarea') inp.type = field.type;
                wrap.append(lbl, inp); container.append(wrap);
            });
            btn.style.display = 'flex';
        }

        async function previewAndCompressImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const info = document.getElementById("kompresiInfo");
            const imgP = document.getElementById("imgPreview");
            info.innerHTML = "⏳ Menghitung halaman dan menyiapkan antrean...";
            imgP.style.display = "none";
            imageQueue = [];

            if (file.type === "application/pdf") {
                const reader = new FileReader();
                reader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    info.innerHTML = `⏳ Mengekstrak ${pdf.numPages} halaman PDF...`;

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const canvas = document.createElement("canvas");
                        const viewport = page.getViewport({ scale: 1.5 });
                        canvas.height = viewport.height; canvas.width = viewport.width;
                        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
                        
                        const base64 = canvas.toDataURL("image/jpeg", 0.7).split(',')[1];
                        imageQueue.push({ b64: base64, page: i });

                        if (i === 1) { imgP.src = canvas.toDataURL("image/jpeg"); imgP.style.display = "block"; }
                    }
                    info.innerHTML = `✅ Antrean Siap: <b>${pdf.numPages} Halaman</b> terdeteksi.`;
                };
                reader.readAsArrayBuffer(file);
            } else {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = 1000; canvas.height = (img.height / img.width) * 1000;
                        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                        imageQueue.push({ b64: canvas.toDataURL("image/jpeg", 0.7).split(',')[1], page: 1 });
                        imgP.src = canvas.toDataURL("image/jpeg"); imgP.style.display = "block";
                        info.innerHTML = "✅ Foto Tunggal Siap Diproses!";
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function kirimKeAI(tipe) {
            const btn = tipe === 'gambar' ? document.getElementById('btnUpload') : document.getElementById('btnManual');
            const term = document.getElementById("progressTerminal");
            const btnText = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');

            btn.disabled = true; btnText.style.display = 'none'; spinner.style.display = 'block';

            if (tipe === 'gambar') {
                if (imageQueue.length === 0) return tampilkanStatus("❌ Pilih file dulu!", "error");
                term.style.display = "block";
                term.innerHTML = `<b>> Inisialisasi Batch Scan...</b><br>`;
                
                let success = 0; let fail = 0;

                for (let i = 0; i < imageQueue.length; i++) {
                    const current = imageQueue[i];
                    term.innerHTML += `> Memproses [${i+1}/${imageQueue.length}] hal ${current.page}... `;
                    term.scrollTop = term.scrollHeight;

                    try {
                        const res = await fetch(VERCEL_API_URL, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ imageBase64: current.b64, mimeType: "image/jpeg" })
                        });
                        const data = await res.json();

                        if (res.ok) {
                            term.innerHTML += `<span style="color:#10b981">SUKSES</span><br>`;
                            success++;
                        } else {
                            term.innerHTML += `<span style="color:#ef4444">GAGAL (${data.error})</span><br>`;
                            fail++;
                        }
                    } catch (e) {
                        term.innerHTML += `<span style="color:#ef4444">ERROR KONEKSI</span><br>`;
                        fail++;
                    }
                }
                term.innerHTML += `<br><b>> HASIL AKHIR: ${success} Sukses, ${fail} Gagal.</b>`;
                tampilkanStatus("Proses Batch Selesai!", "success");
                imageQueue = [];
            } else {
                // LOGIKA MANUAL
                const kategori = document.getElementById('pilihKategori').value;
                let ringkasan = `Tabel Tujuan: ${kategori}\n`;
                document.querySelectorAll('.dynamic-input').forEach(inp => {
                    ringkasan += `${inp.id}: ${inp.value}\n`;
                });

                try {
                    const res = await fetch(VERCEL_API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ manualText: ringkasan })
                    });
                    const result = await res.json();
                    if (res.ok) {
                        tampilkanStatus("✅ Berhasil Disimpan!", "success");
                        document.querySelectorAll('.dynamic-input').forEach(i => i.value = '');
                    } else { tampilkanStatus("❌ Gagal: " + result.error, "error"); }
                } catch (e) { tampilkanStatus("❌ Koneksi Bermasalah", "error"); }
            }

            btn.disabled = false; btnText.style.display = 'flex'; spinner.style.display = 'none';
        }

        function tampilkanStatus(pesan, tipe) {
            const s = document.getElementById("statusMessage");
            s.innerHTML = pesan; s.className = tipe; s.style.display = "block";
            setTimeout(() => { s.style.display = 'none'; }, 6000);
        }
    </script>
</body>
</html>
