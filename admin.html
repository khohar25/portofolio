<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIFORA | Pusat Kendali</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #149ddd; --bg-dark: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --text-main: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .admin-container { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 2rem; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; max-width: 450px; }
        .tabs { display: flex; background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 1.5rem; overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: #888; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .upload-zone { border: 2px dashed var(--primary); border-radius: 12px; padding: 2rem; text-align: center; position: relative; margin-bottom: 1rem; }
        .upload-zone input { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
        #status-box { margin-top: 1rem; padding: 10px; border-radius: 8px; display: none; font-size: 0.85rem; text-align: center; word-break: break-word; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2 style="text-align:center;">Pusat Kendali Data</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ai')">Gambar/PDF</button>
            <button class="tab-btn" onclick="switchTab('manual')">Ketik Manual</button>
        </div>
        <div id="tab-ai" class="tab-content active">
            <div class="upload-zone">
                <i class="fas fa-cloud-upload-alt" style="font-size:2rem; color:#149ddd; margin-bottom:10px;"></i>
                <div id="fileName">Pilih File (Gambar/PDF)</div>
                <input type="file" id="fileUpload" accept="image/*,application/pdf" onchange="document.getElementById('fileName').innerText = this.files[0].name;">
            </div>
            <button id="btnUpload" onclick="prosesData('gambar')">Ekstrak AI</button>
        </div>
        <div id="tab-manual" class="tab-content">
            <div class="form-group"><input type="text" id="m_judul" placeholder="Judul/Kegiatan"></div>
            <div class="form-group"><input type="text" id="m_peran" placeholder="Sebagai Apa"></div>
            <div class="form-group"><input type="text" id="m_instansi" placeholder="Instansi"></div>
            <div class="form-group"><input type="text" id="m_tahun" placeholder="Tahun"></div>
            <div class="form-group"><textarea id="m_deskripsi" placeholder="Deskripsi, Tech Stack, atau Link..."></textarea></div>
            <button id="btnManual" onclick="prosesData('teks')">Kirim ke AI Router</button>
        </div>
        <div id="status-box"></div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function tampilkanStatus(pesan, warna) {
            const s = document.getElementById('status-box');
            s.style.display = 'block'; s.style.color = warna; s.style.border = `1px solid ${warna}`;
            s.innerHTML = pesan;
        }

        async function prosesData(mode) {
            let payload = {};
            if (mode === 'gambar') {
                const file = document.getElementById('fileUpload').files[0];
                if (!file) return alert("Pilih file!");
                
                // Pengecekan ukuran PDF agar tidak melebihi limit Vercel (Max 4MB)
                if (file.type === 'application/pdf' && file.size > 4 * 1024 * 1024) {
                    return tampilkanStatus("❌ Ukuran PDF maksimal 4MB!", "#e74c3c");
                }

                tampilkanStatus("Membaca file...", "#149ddd");
                document.getElementById('btnUpload').disabled = true;

                try {
                    let fileToProcess = file;
                    // Hanya lakukan kompresi jika file adalah gambar (JPG/PNG)
                    if (file.type.startsWith('image/')) {
                        fileToProcess = await browserImageCompression(file, { maxSizeMB: 0.1, maxWidthOrHeight: 1024 });
                    }
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(fileToProcess);
                    reader.onloadend = async () => {
                        payload = { imageBase64: reader.result.split(',')[1], mimeType: fileToProcess.type };
                        await kirimKeAPI(payload, mode);
                        document.getElementById('btnUpload').disabled = false;
                    };
                } catch(e) { 
                    tampilkanStatus("❌ Gagal membaca file.", "#e74c3c"); 
                    document.getElementById('btnUpload').disabled = false;
                }
            } else {
                document.getElementById('btnManual').disabled = true;
                payload = { manualText: `Judul: ${document.getElementById('m_judul').value}\nPeran: ${document.getElementById('m_peran').value}\nInstansi: ${document.getElementById('m_instansi').value}\nTahun: ${document.getElementById('m_tahun').value}\nDeskripsi: ${document.getElementById('m_deskripsi').value}` };
                await kirimKeAPI(payload, mode);
                document.getElementById('btnManual').disabled = false;
            }
        }

        async function kirimKeAPI(payload, mode) {
            tampilkanStatus("Mengirim ke Server AI...", "#149ddd");
            try {
                const res = await fetch('/api/ekstrak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const text = await res.text();
                
                try {
                    const json = JSON.parse(text);
                    if (json.success) {
                        tampilkanStatus(`✅ ${json.message}`, "#2ecc71");
                        if(mode === 'teks') {
                            document.querySelectorAll('input, textarea').forEach(i => i.value = '');
                        } else {
                            document.getElementById('fileName').innerText = "Pilih File (Gambar/PDF)";
                            document.getElementById('fileUpload').value = "";
                        }
                    } else { 
                        tampilkanStatus(`❌ ${json.error}`, "#e74c3c"); 
                    }
                } catch (e) {
                    tampilkanStatus(`❌ Server Error: ${text.substring(0, 60)}...`, "#e74c3c");
                }
            } catch (e) { 
                tampilkanStatus("❌ Error Jaringan/Server", "#e74c3c"); 
            }
        }
    </script>
</body>
</html>
